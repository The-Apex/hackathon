<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — BloodSync</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-wrapper { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 64px); padding: 24px; }
        .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); width: 100%; max-width: 440px; overflow: hidden; box-shadow: var(--shadow-lg); }
        .auth-header { padding: 32px 32px 0; text-align: center; }
        .auth-header h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
        .auth-header p { color: var(--text-muted); font-size: 0.9rem; }
        .auth-body { padding: 24px 32px 32px; }
        .role-tabs { display: flex; border-bottom: 1px solid var(--border); }
        .role-tab { flex: 1; padding: 14px; text-align: center; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-muted); transition: all 0.2s; background: none; border-top: none; border-left: none; border-right: none; }
        .role-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .role-tab:hover { color: var(--text); }
        .auth-footer { text-align: center; padding-bottom: 24px; font-size: 0.85rem; color: var(--text-muted); }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        .error-msg { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 16px; text-align: center; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <div class="logo">🩸</div>
            BloodSync
        </a>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card animate-in">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Sign in to your account</p>
            </div>

            <!-- ROLE TABS -->
            <div class="role-tabs" id="roleTabs">
                <button class="role-tab active" onclick="setRole('user', this)">👤 User</button>
                <button class="role-tab" onclick="setRole('hospital', this)">🚑 Hospital</button>
                <button class="role-tab" onclick="setRole('bank', this)">🏥 Blood Bank</button>
            </div>

            <div class="auth-body">
                <div id="error-box" style="display:none;" class="error-msg"></div>
                <form method="POST" action="auth.php" id="loginForm">
                    <input type="hidden" name="role" id="roleField" value="user">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="password-wrapper">
                            <input type="password" name="password" id="loginPassword" class="form-input" placeholder="Enter your password" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)" title="Toggle password visibility">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </form>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="register.html" id="registerLink">Create one</a>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roleNames = { user: '👤 User', hospital: '🚑 Hospital', bank: '🏥 Blood Bank' };

        if (params.get('error')) {
            document.getElementById('error-box').style.display = 'block';
            document.getElementById('error-box').innerText = decodeURIComponent(params.get('error'));
        }

        // If role is specified in URL → hide tabs, lock to that role
        const fixedRole = params.get('role');
        if (fixedRole && roleNames[fixedRole]) {
            document.getElementById('roleTabs').style.display = 'none';
            document.getElementById('roleField').value = fixedRole;
            document.querySelector('.auth-header h1').innerText = (roleNames[fixedRole] || '') + ' Sign In';
            document.querySelector('.auth-header p').innerText = 'Sign in to your ' + fixedRole + ' account';
            document.getElementById('registerLink').href = 'register.html?role=' + fixedRole;
        }

        function setRole(role, btn) {
            document.getElementById('roleField').value = role;
            document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
            if (btn) btn.classList.add('active');
            else {
                const tabs = document.querySelectorAll('.role-tab');
                if (role === 'user') tabs[0].classList.add('active');
                if (role === 'hospital') tabs[1].classList.add('active');
                if (role === 'bank') tabs[2].classList.add('active');
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = '🙈';
            } else {
                input.type = 'password';
                btn.innerText = '👁️';
            }
        }
    </script>
</body>
</html>
